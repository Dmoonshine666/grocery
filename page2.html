<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>水印添加工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Zhi+Mang+Xing&display=swap" rel="stylesheet" />
<link rel="icon" href="https://images.icon-icons.com/506/PNG/96/watermark_icon-icons.com_49331.png" type="image/png">
<style>
  :root{
    --blue-50:#eef6ff;
    --blue-100:#d9ebff;
    --blue-200:#bcdcff;
    --blue-300:#8cc3ff;
    --blue-400:#5aa2f5;
    --blue-500:#3b82f6;
    --blue-600:#2f6fe0;
    --blue-700:#2559b8;
    --ink:#1f2d3d;
    --ink-soft:#5a6b7b;
    --line:#e3edf7;
    --bg:#f4f9ff;
    --card:#ffffff;
    --shadow:0 8px 28px rgba(43,110,200,.10);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#f7fbff 0%,#eef6ff 100%);
    color:var(--ink);
    min-height:100vh;
  }
  header{
    display:flex;align-items:center;gap:12px;
    padding:18px 28px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .logo{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg,var(--blue-400),var(--blue-600));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:18px;box-shadow:0 4px 12px rgba(47,111,224,.35);
  }
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px;}
  header .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  header .spacer{flex:1;}
  .badge{font-size:12px;color:var(--blue-700);background:var(--blue-100);padding:5px 12px;border-radius:20px;font-weight:600;}

  .layout{
    display:grid;
    grid-template-columns:360px 1fr;
    gap:22px;
    padding:22px 28px 40px;
    max-width:1400px;margin:0 auto;
    align-items:start;
  }
  @media (max-width:980px){
    .layout{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
  }
  .panel + .panel{margin-top:18px;}
  .section-title{
    font-size:13px;font-weight:700;color:var(--blue-700);
    text-transform:none;letter-spacing:.4px;
    display:flex;align-items:center;gap:8px;margin:0 0 14px;
  }
  .section-title .num{
    width:20px;height:20px;border-radius:6px;background:var(--blue-100);color:var(--blue-700);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  }

  /* upload */
  .drop{
    border:2px dashed var(--blue-200);
    border-radius:12px;
    padding:26px 16px;text-align:center;cursor:pointer;
    transition:.18s;background:var(--blue-50);
  }
  .drop:hover,.drop.over{border-color:var(--blue-500);background:var(--blue-100);}
  .drop .ic{font-size:30px;}
  .drop .t1{font-weight:600;margin-top:6px;font-size:14px;}
  .drop .t2{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .fileinfo{
    display:none;align-items:center;gap:10px;margin-top:12px;
    background:var(--blue-50);border:1px solid var(--blue-100);border-radius:10px;padding:10px 12px;
  }
  .fileinfo.show{display:flex;}
  .fileinfo .fi-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fileinfo .fi-meta{font-size:11px;color:var(--ink-soft);}
  .fileinfo .fi-x{cursor:pointer;color:var(--ink-soft);font-size:16px;line-height:1;}

  /* segmented control */
  .seg{display:flex;background:var(--blue-50);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;}
  .seg button{
    flex:1;border:0;background:transparent;padding:9px 4px;border-radius:7px;
    font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:.15s;font-family:inherit;
  }
  .seg button.active{background:#fff;color:var(--blue-700);box-shadow:0 2px 6px rgba(43,110,200,.15);}

  .field{margin-top:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input[type=text],.field select,.field input[type=color]{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;
    font-family:inherit;background:#fff;color:var(--ink);outline:none;transition:.15s;
  }
  .field input[type=text]:focus,.field select:focus{border-color:var(--blue-400);box-shadow:0 0 0 3px var(--blue-100);}
  .field input[type=color]{height:42px;padding:4px;cursor:pointer;}
  .row2{display:flex;gap:10px;}
  .row2 > *{flex:1;}

  /* slider */
  .slider-row{display:flex;align-items:center;gap:12px;margin-top:14px;}
  .slider-row .slabel{font-size:12px;color:var(--ink-soft);font-weight:600;min-width:64px;}
  .slider-row input[type=range]{flex:1;-webkit-appearance:none;height:6px;border-radius:6px;background:var(--blue-100);outline:none;}
  .slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--blue-500);cursor:pointer;box-shadow:0 2px 6px rgba(47,111,224,.4);border:2px solid #fff;}
  .slider-row input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--blue-500);cursor:pointer;border:2px solid #fff;}
  .slider-row .sval{font-size:12px;font-weight:700;color:var(--blue-700);min-width:46px;text-align:right;}

  .hint{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}

  /* position grid */
  .posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;max-width:180px;}
  .posgrid button{
    aspect-ratio:1/1;border:1px solid var(--line);background:var(--blue-50);border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .posgrid button .dot{width:7px;height:7px;border-radius:50%;background:var(--blue-200);}
  .posgrid button.active{background:var(--blue-500);border-color:var(--blue-500);}
  .posgrid button.active .dot{background:#fff;}

  .hidden{display:none !important;}

  /* preview */
  .preview-wrap{position:sticky;top:90px;}
  .preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .preview-head .pt{font-size:14px;font-weight:700;color:var(--ink);}
  .preview-head .pm{font-size:12px;color:var(--ink-soft);}
  .stage{
    background:
      linear-gradient(45deg,#eef3f9 25%,transparent 25%),
      linear-gradient(-45deg,#eef3f9 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#eef3f9 75%),
      linear-gradient(-45deg,transparent 75%,#eef3f9 75%);
    background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;
    border:1px solid var(--line);border-radius:12px;min-height:420px;
    display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;
  }
  #previewCanvas{max-width:100%;max-height:70vh;box-shadow:0 6px 20px rgba(31,45,61,.12);border-radius:4px;background:#fff;}
  .empty-tip{color:var(--ink-soft);font-size:14px;text-align:center;padding:40px;}
  .empty-tip .big{font-size:40px;margin-bottom:10px;}

  .actions{display:flex;gap:12px;margin-top:18px;}
  .btn{
    flex:1;border:0;border-radius:11px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary{background:linear-gradient(135deg,var(--blue-400),var(--blue-600));color:#fff;box-shadow:0 6px 16px rgba(47,111,224,.35);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{background:var(--blue-50);color:var(--blue-700);border:1px solid var(--blue-100);}
  .btn-ghost:hover{background:var(--blue-100);}

  .progress{margin-top:14px;display:none;}
  .progress.show{display:block;}
  .progress .bar{height:8px;border-radius:6px;background:var(--blue-100);overflow:hidden;}
  .progress .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue-400),var(--blue-600));transition:width .2s;}
  .progress .ptxt{font-size:12px;color:var(--ink-soft);margin-top:6px;text-align:center;}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:600;
    opacity:0;transition:.25s;z-index:60;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:#e5484d;}
</style>
</head>
<body>
<header>
  <div class="logo">水</div>
  <div>
    <h1>水印添加工具</h1>
    <div class="sub">为 PDF 与图片批量添加文字 / 图片水印</div>
  </div>
  <div class="spacer"></div>
  <div class="badge">浅蓝主题</div>
</header>

<div class="layout">
  <!-- 左侧参数面板 -->
  <div class="left">
    <!-- 1 上传 -->
    <div class="panel">
      <div class="section-title"><span class="num">1</span>上传文件</div>
      <div class="drop" id="drop">
        <div class="ic">📂</div>
        <div class="t1">点击或拖拽文件到此处</div>
        <div class="t2">支持 PDF、PNG、JPG、WEBP 等图片格式</div>
      </div>
      <input type="file" id="fileInput" accept=".pdf,image/*" hidden />
      <div class="fileinfo" id="fileInfo">
        <div style="flex:1;overflow:hidden;">
          <div class="fi-name" id="fiName">—</div>
          <div class="fi-meta" id="fiMeta">—</div>
        </div>
        <div class="fi-x" id="fiClear" title="移除">✕</div>
      </div>
    </div>

    <!-- 2 水印类型 -->
    <div class="panel">
      <div class="section-title"><span class="num">2</span>水印类型</div>
      <div class="seg" id="typeSeg">
        <button data-type="text" class="active">纯文字</button>
        <button data-type="image">纯图片</button>
        <button data-type="both">图文混合</button>
      </div>

      <!-- 文字设置 -->
      <div id="textSettings">
        <div class="field">
          <label>水印文字</label>
          <input type="text" id="wmText" value="" placeholder="输入水印文字" />
        </div>
        <div class="row2">
          <div class="field">
            <label>字体</label>
            <select id="wmFont">
              <option value="Noto Sans SC">思源黑体</option>
              <option value="Noto Serif SC">思源宋体</option>
              <option value="Ma Shan Zheng">楷书（马善政）</option>
              <option value="ZCOOL KuaiLe">站酷快乐体</option>
              <option value="Zhi Mang Xing">潇洒行书</option>
            </select>
          </div>
          <div class="field">
            <label>字重</label>
            <select id="wmWeight">
              <option value="400">常规</option>
              <option value="700" selected>加粗</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>文字颜色</label>
          <input type="color" id="wmColor" value="#335577" />
        </div>
      </div>

      <!-- 图片设置 -->
      <div id="imgSettings" class="hidden">
        <div class="field">
          <label>水印图片</label>
          <div class="drop" id="imgDrop" style="padding:16px;">
            <div class="ic" style="font-size:22px;">🖼️</div>
            <div class="t2" id="imgDropTip">点击上传水印图片（PNG 透明优先）</div>
          </div>
          <input type="file" id="imgInput" accept="image/*" hidden />
        </div>
      </div>
    </div>

    <!-- 3 外观 -->
    <div class="panel">
      <div class="section-title"><span class="num">3</span>外观与排版</div>

      <div class="slider-row">
        <span class="slabel">透明度</span>
        <input type="range" id="opacity" min="0" max="100" value="30" />
        <span class="sval" id="opacityVal">30%</span>
      </div>

      <div class="slider-row" id="fontSizeRow">
        <span class="slabel">文字大小</span>
        <input type="range" id="fontSize" min="2" max="20" step="0.5" value="6" />
        <span class="sval" id="fontSizeVal">6%</span>
      </div>

      <div class="slider-row hidden" id="imgSizeRow">
        <span class="slabel">图片尺寸</span>
        <input type="range" id="imgSize" min="5" max="60" value="20" />
        <span class="sval" id="imgSizeVal">20%</span>
      </div>

      <div class="slider-row">
        <span class="slabel">旋转角度</span>
        <input type="range" id="rotation" min="-180" max="180" value="-30" />
        <span class="sval" id="rotationVal">-30°</span>
      </div>

      <div class="slider-row hidden" id="spacingRow">
        <span class="slabel">平铺间距</span>
        <input type="range" id="spacing" min="2" max="40" value="14" />
        <span class="sval" id="spacingVal">14%</span>
      </div>

      <div class="field">
        <label>布局方式</label>
        <div class="seg" id="layoutSeg">
          <button data-layout="single" class="active">单点</button>
          <button data-layout="tile">整页平铺</button>
        </div>
      </div>

      <div id="posBox">
        <label style="font-size:12px;color:var(--ink-soft);font-weight:600;display:block;margin-top:14px;">单点位置</label>
        <div class="posgrid" id="posGrid">
          <button data-pos="0,0"><span class="dot"></span></button>
          <button data-pos="50,0"><span class="dot"></span></button>
          <button data-pos="100,0"><span class="dot"></span></button>
          <button data-pos="0,50"><span class="dot"></span></button>
          <button data-pos="50,50" class="active"><span class="dot"></span></button>
          <button data-pos="100,50"><span class="dot"></span></button>
          <button data-pos="0,100"><span class="dot"></span></button>
          <button data-pos="50,100"><span class="dot"></span></button>
          <button data-pos="100,100"><span class="dot"></span></button>
        </div>
      </div>
    </div>

    <!-- 4 导出 -->
    <div class="panel">
      <div class="section-title"><span class="num">4</span>导出</div>
      <div class="actions">
        <button class="btn btn-ghost" id="resetBtn">重置参数</button>
        <button class="btn btn-primary" id="exportBtn" disabled>⬇ 导出并下载</button>
      </div>
      <div class="progress" id="progress">
        <div class="bar"><i id="progressBar"></i></div>
        <div class="ptxt" id="progressTxt">处理中…</div>
      </div>
    </div>
  </div>

  <!-- 右侧预览 -->
  <div class="preview-wrap">
    <div class="preview-head">
      <div class="pt">实时预览</div>
      <div class="pm" id="previewMeta">尚未选择文件</div>
    </div>
    <div class="stage" id="stage">
      <div class="empty-tip" id="emptyTip">
        <div class="big">📄</div>
        上传文件后，这里将实时显示加水印效果
      </div>
      <canvas id="previewCanvas" class="hidden"></canvas>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- 全局状态 ----------
  const state = {
    file:null, fileType:null, // 'pdf' | 'image'
    pdfDoc:null, pdfPageCount:0,
    baseImage:null, // 图片模式：原始 Image
    imgW:0, imgH:0,
    type:"text", // text | image | both
    text:"",
    font:"Noto Sans SC",
    weight:"700",
    color:"#335577",
    watermarkImg:null, watermarkImgEl:null,
    opacity:30,
    fontSize:6,   // % of width
    imgSize:20,   // % of width
    rotation:-30,
    spacing:14,   // % of width
    layout:"single", // single | tile
    pos:{x:50,y:50}
  };

  const FONTS = ["Noto Sans SC","Noto Serif SC","Ma Shan Zheng","ZCOOL KuaiLe","Zhi Mang Xing"];

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const drop=$("drop"), fileInput=$("fileInput"), fileInfo=$("fileInfo"),
        fiName=$("fiName"), fiMeta=$("fiMeta"), fiClear=$("fiClear");
  const previewCanvas=$("previewCanvas"), emptyTip=$("emptyTip"), previewMeta=$("previewMeta");
  const stage=$("stage");

  // ---------- 工具 ----------
  function toast(msg, isErr){
    const t=$("toast"); t.textContent=msg; t.className="toast show"+(isErr?" err":"");
    setTimeout(()=>{t.className="toast"+(isErr?" err":"");},2200);
  }
  function hexToRgb(hex){
    const m=hex.replace("#","");
    const n=m.length===3? m.split("").map(c=>c+c).join(""):m;
    const int=parseInt(n,16);
    return {r:(int>>16)&255,g:(int>>8)&255,b:int&255};
  }

  // ---------- 字体加载 ----------
  async function ensureFonts(){
    try{
      await Promise.all(FONTS.map(f=>document.fonts.load(`700 40px '${f}'`).catch(()=>{})));
      await document.fonts.ready;
    }catch(e){/* 网络异常时回退系统字体 */}
  }

  // ---------- 文件上传 ----------
  drop.addEventListener("click",()=>fileInput.click());
  drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over");});
  drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
  drop.addEventListener("drop",e=>{
    e.preventDefault();drop.classList.remove("over");
    if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change",e=>{ if(e.target.files.length) handleFile(e.target.files[0]); });

  async function handleFile(file){
    const name=file.name.toLowerCase();
    if(name.endsWith(".pdf")){
      state.file=file; state.fileType="pdf";
      await loadPdf(file);
    } else if(file.type.startsWith("image/")){
      state.file=file; state.fileType="image";
      await loadImage(file);
    } else {
      toast("不支持的文件类型",true); return;
    }
    fiName.textContent=file.name;
    fileInfo.classList.add("show");
    $("exportBtn").disabled=false;
    renderPreview();
  }

  fiClear.addEventListener("click",()=>{
    state.file=null; state.fileType=null; state.pdfDoc=null; state.baseImage=null;
    fileInput.value=""; fileInfo.classList.remove("show");
    $("exportBtn").disabled=true;
    emptyTip.classList.remove("hidden"); previewCanvas.classList.add("hidden");
    previewMeta.textContent="尚未选择文件";
  });

  async function loadPdf(file){
    const buf=await file.arrayBuffer();
    if(window.pdfjsLib){
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      state.pdfDoc=await pdfjsLib.getDocument({data:buf}).promise;
      state.pdfPageCount=state.pdfDoc.numPages;
      previewMeta.textContent=`PDF · 共 ${state.pdfPageCount} 页 · 预览第 1 页`;
    } else {
      throw new Error("PDF 引擎加载失败，请检查网络");
    }
  }

  async function loadImage(file){
    const url=URL.createObjectURL(file);
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
    state.baseImage=img; state.imgW=img.naturalWidth; state.imgH=img.naturalHeight;
    previewMeta.textContent=`图片 · ${state.imgW}×${state.imgH} px`;
  }

  // ---------- 水印图片上传 ----------
  $("imgDrop").addEventListener("click",()=>$("imgInput").click());
  $("imgInput").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const url=URL.createObjectURL(f);
    const img=new Image();
    img.onload=()=>{
      state.watermarkImgEl=img;
      $("imgDropTip").textContent="已选择："+f.name;
      $("imgDropTip").style.color="var(--blue-700)";
      renderPreview();
    };
    img.src=url;
  });

  // ---------- 参数联动 ----------
  function bindSeg(segId, attr, cb){
    $(segId).querySelectorAll("button").forEach(b=>{
      b.addEventListener("click",()=>{
        $(segId).querySelectorAll("button").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
        cb(b.dataset[attr]);
      });
    });
  }
  bindSeg("typeSeg","type",v=>{
    state.type=v;
    $("textSettings").classList.toggle("hidden", v==="image");
    $("imgSettings").classList.toggle("hidden", v==="text");
    $("fontSizeRow").classList.toggle("hidden", v==="image");
    $("imgSizeRow").classList.toggle("hidden", v==="text");
    renderPreview();
  });
  bindSeg("layoutSeg","layout",v=>{
    state.layout=v;
    $("posBox").classList.toggle("hidden", v==="tile");
    $("spacingRow").classList.toggle("hidden", v==="single");
    renderPreview();
  });
  $("posGrid").querySelectorAll("button").forEach(b=>{
    b.addEventListener("click",()=>{
      $("posGrid").querySelectorAll("button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      const [x,y]=b.dataset.pos.split(",").map(Number);
      state.pos={x,y};
      renderPreview();
    });
  });

  function bindSlider(id, key, suffix, transform){
    const el=$(id), valEl=$(id+"Val");
    el.addEventListener("input",()=>{
      let v=parseFloat(el.value);
      state[key]= (transform?transform(v):v);
      valEl.textContent= (transform?transform(v):v)+suffix;
      scheduleRender();
    });
  }
  bindSlider("opacity","opacity","%");
  bindSlider("fontSize","fontSize","%");
  bindSlider("imgSize","imgSize","%");
  bindSlider("rotation","rotation","°");
  bindSlider("spacing","spacing","%");

  $("wmText").addEventListener("input",e=>{state.text=e.target.value;renderPreview();});
  $("wmFont").addEventListener("change",e=>{state.font=e.target.value;renderPreview();});
  $("wmWeight").addEventListener("change",e=>{state.weight=e.target.value;renderPreview();});
  $("wmColor").addEventListener("input",e=>{state.color=e.target.value;renderPreview();});

  // ---------- 渲染（防抖） ----------
  let rafId=null;
  function scheduleRender(){
    if(rafId) cancelAnimationFrame(rafId);
    rafId=requestAnimationFrame(()=>{rafId=null;renderPreview();});
  }

  // 核心：在任意 ctx 上绘制水印（W,H 为画布像素尺寸）
  function drawWatermark(ctx, W, H){
    ctx.save();
    ctx.globalAlpha = state.opacity/100;
    const rgb=hexToRgb(state.color);
    ctx.fillStyle=`rgb(${rgb.r},${rgb.g},${rgb.b})`;

    const showText = (state.type!=="image") && state.text.trim().length>0;
    const showImg  = (state.type!=="text") && state.watermarkImgEl;

    const textPx = state.fontSize/100 * W;
    const imgW = state.imgSize/100 * W;
    let imgH=0;
    if(showImg){
      const ar=state.watermarkImgEl.naturalHeight/state.watermarkImgEl.naturalWidth;
      imgH=imgW*ar;
    }
    const gap = 0.02*W;
    const unitW = showImg ? imgW : (showText? measureText(ctx,textPx) : 0);
    const unitH = (showImg?imgH:0) + (showText?textPx:0) + (showImg&&showText?gap:0);

    function drawUnit(cx,cy){
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(state.rotation*Math.PI/180);
      // 组合块：图片在上，文字在下，垂直居中
      const top = -unitH/2;
      let cursor = top;
      if(showImg){
        const iy = cursor + imgH/2;
        ctx.drawImage(state.watermarkImgEl, -imgW/2, iy-imgH/2, imgW, imgH);
        cursor += imgH;
        if(showText) cursor += gap;
      }
      if(showText){
        ctx.font = `${state.weight} ${textPx}px '${state.font}', sans-serif`;
        ctx.textAlign="center"; ctx.textBaseline="middle";
        const ty = cursor + textPx/2;
        ctx.fillText(state.text, 0, ty);
      }
      ctx.restore();
    }

    function measureText(c,px){
      c.font=`${state.weight} ${px}px '${state.font}', sans-serif`;
      return c.measureText(state.text).width;
    }

    if(state.layout==="single"){
      const cx=state.pos.x/100*W, cy=state.pos.y/100*H;
      drawUnit(cx,cy);
    } else {
      const stepX = unitW + state.spacing/100*W;
      const stepY = unitH + state.spacing/100*W;
      const margin = Math.max(W,H);
      for(let y=-margin; y<H+margin; y+=stepY){
        for(let x=-margin; x<W+margin; x+=stepX){
          drawUnit(x,y);
        }
      }
    }
    ctx.restore();
  }

  async function renderPreview(){
    if(!state.file) return;
    emptyTip.classList.add("hidden");
    previewCanvas.classList.remove("hidden");

    const targetW = 640; // 预览基准宽度
    let baseCanvas;

    if(state.fileType==="pdf"){
      if(!state.pdfDoc) return;
      const page=await state.pdfDoc.getPage(1);
      const vp=page.getViewport({scale:1});
      const scale=targetW/vp.width;
      const rvp=page.getViewport({scale});
      baseCanvas=document.createElement("canvas");
      baseCanvas.width=Math.round(rvp.width);
      baseCanvas.height=Math.round(rvp.height);
      await page.render({canvasContext:baseCanvas.getContext("2d"),viewport:rvp}).promise;
    } else {
      const scale=targetW/state.imgW;
      baseCanvas=document.createElement("canvas");
      baseCanvas.width=Math.round(state.imgW*scale);
      baseCanvas.height=Math.round(state.imgH*scale);
      baseCanvas.getContext("2d").drawImage(state.baseImage,0,0,baseCanvas.width,baseCanvas.height);
    }

    // 合成
    previewCanvas.width=baseCanvas.width;
    previewCanvas.height=baseCanvas.height;
    const pctx=previewCanvas.getContext("2d");
    pctx.drawImage(baseCanvas,0,0);
    drawWatermark(pctx, previewCanvas.width, previewCanvas.height);
  }

  // ---------- 导出 ----------
  $("exportBtn").addEventListener("click", exportFile);

  async function exportFile(){
    if(!state.file) return;
    const btn=$("exportBtn"); btn.disabled=true;
    const prog=$("progress"); prog.classList.add("show");
    setProgress(0,"准备中…");

    try{
      if(state.fileType==="image"){
        setProgress(40,"渲染水印…");
        const scale=Math.min(1, 2400/state.imgW); // 限制超大图
        const c=document.createElement("canvas");
        c.width=Math.round(state.imgW*scale); c.height=Math.round(state.imgH*scale);
        const cx=c.getContext("2d");
        cx.drawImage(state.baseImage,0,0,c.width,c.height);
        drawWatermark(cx,c.width,c.height);
        setProgress(85,"导出 PNG…");
        const blob=await new Promise(r=>c.toBlob(r,"image/png"));
        downloadBlob(blob, rename(state.file.name,"png"));
      } else {
        if(!window.jspdf){ throw new Error("PDF 导出库未加载"); }
        const {jsPDF}=window.jspdf;
        const total=state.pdfPageCount;
        const renderPage=async(i)=>{
          const page=await state.pdfDoc.getPage(i);
          const scale=2.0; // 导出清晰度
          const rvp=page.getViewport({scale});
          const c=document.createElement("canvas");
          c.width=Math.round(rvp.width); c.height=Math.round(rvp.height);
          await page.render({canvasContext:c.getContext("2d"),viewport:rvp}).promise;
          drawWatermark(c.getContext("2d"),c.width,c.height);
          return {w:c.width,h:c.height,data:c.toDataURL("image/jpeg",0.92)};
        };
        setProgress(10,`处理第 1/${total} 页…`);
        const first=await renderPage(1);
        const out=new jsPDF({unit:"px",format:[first.w,first.h],compress:true});
        out.addImage(first.data,"JPEG",0,0,first.w,first.h);
        for(let i=2;i<=total;i++){
          setProgress(Math.round((i-1)/total*90), `处理第 ${i}/${total} 页…`);
          const p=await renderPage(i);
          out.addPage([p.w,p.h]);
          out.addImage(p.data,"JPEG",0,0,p.w,p.h);
        }
        setProgress(95,"生成 PDF…");
        out.save(rename(state.file.name,"pdf"));
      }
      setProgress(100,"完成 ✓");
      toast("导出成功，已开始下载");
      setTimeout(()=>prog.classList.remove("show"),1200);
    }catch(err){
      console.error(err);
      toast("导出失败："+err.message,true);
      prog.classList.remove("show");
    }finally{
      btn.disabled=false;
    }
  }

  function setProgress(p,txt){ $("progressBar").style.width=p+"%"; if(txt) $("progressTxt").textContent=txt; }
  function rename(name,ext){ return name.replace(/\.[^.]+$/,"")+"_水印."+ext; }
  function downloadBlob(blob,filename){
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  }

  // ---------- 重置 ----------
  $("resetBtn").addEventListener("click",()=>{
    state.opacity=30; state.fontSize=6; state.imgSize=20; state.rotation=-30; state.spacing=14;
    $("opacity").value=30; $("opacityVal").textContent="30%";
    $("fontSize").value=6; $("fontSizeVal").textContent="6%";
    $("imgSize").value=20; $("imgSizeVal").textContent="20%";
    $("rotation").value=-30; $("rotationVal").textContent="-30°";
    $("spacing").value=14; $("spacingVal").textContent="14%";
    $("wmText").value=""; state.text="";
    renderPreview();
    toast("参数已重置");
  });

  // ---------- 启动 ----------
  ensureFonts().then(renderPreview);
})();
</script>
</body>
</html>
